name: Update prices and deploy

on:
  schedule:
    # Every day at 07:15 and 15:15 UTC (most retailer feeds refresh overnight or mid-morning)
    - cron: '15 7,15 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch latest prices
        run: node scripts/update-prices.mjs

      - name: Save price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # If main moved on while this run was going (another run, or a push),
          # start again from the latest main so no history is lost.
          for attempt in 1 2 3; do
            git add site/data/prices.json
            git diff --cached --quiet && break
            git commit -m "Update fuel prices $(date -u +%Y-%m-%d)"
            git push && break
            echo "Push rejected, retrying from latest main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            node scripts/update-prices.mjs
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
